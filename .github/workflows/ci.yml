name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # E2E drives the real Headless Commerce + RGA + Search Agent paths against a live Coveo
    # org (see docs/testing-strategy.md) — there is no mock/sample-response mode in the app
    # itself, so credentials must come from repo secrets. NEXT_PUBLIC_* must be set here (not
    # only at runtime) since Next.js inlines it into the client bundle at build time.
    env:
      COVEO_ORGANIZATION_ID: ${{ secrets.COVEO_ORGANIZATION_ID }}
      NEXT_PUBLIC_COVEO_ANONYMOUS_SEARCH_API_KEY: ${{ secrets.COVEO_ANONYMOUS_SEARCH_API_KEY }}
      COVEO_PLATFORM_API_KEY: ${{ secrets.COVEO_PLATFORM_API_KEY }}
      COVEO_SEARCH_AGENT_ID: ${{ secrets.COVEO_SEARCH_AGENT_ID }}
      COVEO_AUTH_MODE: anonymous-api-key
      COVEO_SEARCH_API_BASE_URL: https://platform-eu.cloud.coveo.com/rest/search/v2
      COVEO_FEATURE_ANALYTICS: "true"
      COVEO_FEATURE_GENERATIVE_ENABLED: "true"
      COVEO_FEATURE_GENERATIVE_CITATIONS: "true"
      COVEO_FEATURE_GENERATIVE_FEEDBACK: "true"
      COVEO_FEATURE_GENERATIVE_DISCLAIMER: "true"
      COVEO_FEATURE_GENERATIVE_STREAMING: "true"
      COVEO_FEATURE_TRENDING_ENABLED: "true"
      COVEO_FEATURE_CONVERSATION_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Secret scan
        run: npm run secrets:scan
