name: Demo Readiness

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened
  push:
    branches:
      - "demo/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: demo-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Demo Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || contains(join(github.event.pull_request.labels.*.name, ','), 'demo-readiness')

    # validate:full runs the Playwright E2E suite, which drives the real Headless Commerce +
    # RGA + Search Agent paths against a live Coveo org (see docs/testing-strategy.md) — there
    # is no mock/sample-response mode in the app itself, so credentials must come from repo
    # secrets. NEXT_PUBLIC_* must be set here (not only at runtime) since Next.js inlines it
    # into the client bundle at build time.
    env:
      COVEO_ORGANIZATION_ID: ${{ secrets.COVEO_ORGANIZATION_ID }}
      NEXT_PUBLIC_COVEO_ANONYMOUS_SEARCH_API_KEY: ${{ secrets.COVEO_ANONYMOUS_SEARCH_API_KEY }}
      COVEO_PLATFORM_API_KEY: ${{ secrets.COVEO_PLATFORM_API_KEY }}
      COVEO_SEARCH_AGENT_ID: ${{ secrets.COVEO_SEARCH_AGENT_ID }}
      COVEO_AUTH_MODE: anonymous-api-key
      COVEO_SEARCH_API_BASE_URL: https://platform-eu.cloud.coveo.com/rest/search/v2
      COVEO_FEATURE_ANALYTICS: "true"
      COVEO_FEATURE_GENERATIVE_ENABLED: "true"
      COVEO_FEATURE_GENERATIVE_CITATIONS: "true"
      COVEO_FEATURE_GENERATIVE_FEEDBACK: "true"
      COVEO_FEATURE_GENERATIVE_DISCLAIMER: "true"
      COVEO_FEATURE_GENERATIVE_STREAMING: "true"
      COVEO_FEATURE_TRENDING_ENABLED: "true"
      COVEO_FEATURE_CONVERSATION_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run full validation
        run: npm run validate:full

      - name: Generate demo readiness report
        if: always()
        run: |
          mkdir -p agent-reports
          npm run agent:demo-readiness -- --output agent-reports/demo-readiness.md

      - name: Upload demo readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-readiness
          path: |
            agent-reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
